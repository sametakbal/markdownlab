name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Fetch OCR language data
        run: python scripts/fetch_tessdata.py

      - name: Test
        env:
          TESSDATA_PREFIX: ${{ github.workspace }}\tessdata
        run: python -m pytest -q
