[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "markdownlab"
dynamic = ["version"]
description = "Desktop app that converts PDF and DOCX files to Markdown while preserving characters and formatting"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "PySide6>=6.6",
    "mammoth>=1.8",
    "markdownify>=0.13",
    "pymupdf>=1.26",
    "pymupdf4llm>=0.2",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "python-docx>=1.1", "pyinstaller>=6"]

[project.scripts]
markdownlab = "markdownlab.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "markdownlab.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
